<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Viva el Amor</title>

  <!-- PWA (se puede instalar como app y funciona sin internet) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#eef3ff">
  <link rel="icon" href="icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Viva el Amor">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de inicio: al tocarla se pone en pantalla completa -->
  <div id="inicio" class="cargando">
    <h1 id="inicioTitulo"></h1>
    <p id="inicioTexto"></p>
  </div>

  <!-- Personaje del centro (fijo) -->
  <div id="charA">
    <div id="charACapas">
      <img id="ojosA"   class="capa" alt="" draggable="false">
      <img id="cuerpoA" class="capa" alt="" draggable="false">
    </div>
  </div>

  <!-- Globo de pregunta (encima del personaje del centro) -->
  <div id="bubble" class="globo">
    <span id="bubbleText"></span>
    <div class="btns">
      <button id="btnSi"></button>
      <button id="btnNo"></button>
    </div>
  </div>

  <!-- Personaje movible (arrastrable) -->
  <div id="charB">
    <img id="imgB" class="capa" alt="" draggable="false">
  </div>

  <!-- Globo de juntar -->
  <div id="cuadroJuntar" class="globo">
    <span id="juntarText"></span>
    <div class="btns">
      <button id="btnJuntarSi"></button>
      <button id="btnJuntarNo"></button>
    </div>
  </div>

  <!-- Final -->
  <div id="final">
    <img id="imgFinal" alt="" draggable="false">
    <p id="mensajeFinal"></p>
    <button id="btnOtraVez"></button>
  </div>

  <!-- Botón pequeño para volver a pantalla completa si se sale -->
  <button id="btnPantallaCompleta" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>

  <script src="config.js"></script>
  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .catch((err) => console.log('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>
</html>
